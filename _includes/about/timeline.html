<div class="timeline-columns">

  <section class="timeline-column timeline-column--left">
    <h2 class="timeline-heading">{{ include.left_title }}</h2>
    <div class="timeline-track">
      {% for item in include.left_source %}
        {% include about/timeline-entry.html item=item index=forloop.index %}
      {% endfor %}
    </div>
  </section>

  <section class="timeline-column timeline-column--right">
    <h2 class="timeline-heading">{{ include.right_title }}</h2>
    <div class="timeline-track">
      {% for item in include.right_source %}
        {% include about/timeline-entry.html item=item index=forloop.index %}
      {% endfor %}
    </div>
  </section>

</div>
