<!-- GitHub Buttons -->
<script async defer src="https://buttons.github.io/buttons.js"></script>

<!-- jQuery CDN -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

<!-- Popper.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.6/umd/popper.min.js"></script>

<!-- Bootstrap JS CDN -->
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

<!-- wow.js CDN & Activation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.js"></script>
<script> new WOW().init(); </script>

<!-- Scroll-reveal (IntersectionObserver, no dependencies) -->
<script defer src="{{ '/assets/js/scroll-reveal.js' | relative_url }}"></script>

<!-- Click-to-zoom lightbox for .zoomable images (no dependencies) -->
<script defer src="{{ '/assets/js/lightbox.js' | relative_url }}"></script>

{% if page.model_viewer %}
<!-- Google <model-viewer> for interactive 3D models (.glb/.gltf).
     Loaded only on pages with `model_viewer: true` in their front matter. -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
{% endif %}

<!-- Initialize all tooltips -->
<script>
$(function () {
    $('[data-toggle="tooltip"]').tooltip()
})
</script>
